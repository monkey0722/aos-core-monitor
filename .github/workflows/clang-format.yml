name: C++ Format Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: Check C++ Code Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The file list lives in scripts/format.sh, not here. This job used to carry its own copy of
      # it, and that copy had no *.cpp in it: every implementation file went unchecked while the one
      # header passed, so the job reported success on unformatted code.
      - name: Check C/C++ formatting
        shell: bash
        env:
          CLANG_FORMAT: clang-format-18
        run: ./scripts/format.sh --check cpp
