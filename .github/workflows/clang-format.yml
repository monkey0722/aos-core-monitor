name: C++ Format Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: Check C++ Code Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check C/C++ formatting
        shell: bash
        run: |
          find app/src/main/cpp -type f \
            \( -name "*.c" -o -name "*.cc" -o -name "*.cxx" \
               -o -name "*.h" -o -name "*.hh" -o -name "*.hpp" \) \
            -print0 |
            xargs -0 --no-run-if-empty \
              clang-format-18 --dry-run --Werror --style=file
